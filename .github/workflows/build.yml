name: Build

on:
  push:
    branches: [master, 'ci/**']
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # v1.2.3 for tag builds, otherwise 0.0.0-<short sha>
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-{0}', github.sha) }}

jobs:
  linux:
    name: Linux tests (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            libavahi-client-dev libavahi-compat-libdnssd-dev \
            libupnp-dev libplist-dev libssl-dev \
            libprotobuf-dev protobuf-compiler \
            libgtest-dev libgmock-dev libspdlog-dev \
            libgl1-mesa-dev libxkbcommon-dev

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -j1

  linux-appimage:
    name: Linux AppImage (Ubuntu 22.04)
    # Oldest supported glibc: the AppImage runs on distros at least this new.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          # The runner's preinstalled libunwind-14-dev blocks libunwind-dev,
          # which libgstreamer1.0-dev depends on.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            libavahi-client-dev libavahi-compat-libdnssd-dev \
            libupnp-dev libplist-dev libssl-dev \
            libprotobuf-dev protobuf-compiler \
            libgtest-dev libgmock-dev \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target airshow

      - name: Package
        run: packaging/linux/package.sh build dist "$VERSION"

      - name: Smoke test AppImage
        # The packaged app must start and open its receivers using only what's bundled.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/AirShow-linux-x86_64.AppImage > smoke.log 2>&1 &
          app=$!
          sleep 10
          # The receiver must be discoverable: browse for it over mDNS.
          mdns=0
          python3 -I tests/tools/mdns_query.py _airplay._tcp 15 || mdns=$?
          kill $app || true
          wait $app || true
          cat smoke.log
          grep -q "CastHandler: listening on port 8009" smoke.log
          grep -q "AirShowHandler: listening on port 7400" smoke.log
          test $mdns -eq 0

      - uses: actions/upload-artifact@v4
        with:
          name: AirShow-linux-x86_64
          path: dist/AirShow-linux-x86_64.AppImage

  macos:
    name: macOS (Homebrew, Apple Silicon)
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install ninja pkgconf qt gstreamer protobuf googletest libplist libupnp spdlog

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix)"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -j1

      - name: Package
        run: packaging/macos/package.sh build dist "${VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: AirShow-macos-arm64
          path: dist/AirShow-macos-arm64.dmg

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p
            qt6-base:p qt6-declarative:p qt6-tools:p
            gstreamer:p gst-plugins-base:p gst-plugins-good:p
            gst-plugins-bad:p gst-plugins-ugly:p gst-libav:p
            openssl:p libplist:p protobuf:p gtest:p spdlog:p

      - name: Configure
        # MSYS2 has no libupnp package; CMake builds pupnp from source.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # -k 0: report every compile error in one run
        run: cmake --build build -- -k 0

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -j1

      - name: Package
        run: |
          packaging/windows/package.sh build dist/AirShow
          (cd dist && zip -qr AirShow-windows-x64.zip AirShow)

      - name: Smoke test package
        # Run from the zip's folder with MSYS2 off PATH: the app must start and
        # open its receivers using only the bundled DLLs and GStreamer plugins.
        # The runner has no Bonjour, so discovery must come from AirShow's own
        # mDNS responder: browse for the receiver over the network.
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $p = Start-Process dist\AirShow\airshow.exe -ArgumentList '--windowed' -PassThru `
                 -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-err.log
          Start-Sleep -Seconds 12
          & $python -I tests/tools/mdns_query.py _airplay._tcp 15
          $mdnsOk = $LASTEXITCODE -eq 0
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content smoke-out.log, smoke-err.log
          $log = "$(Get-Content smoke-out.log -Raw)$(Get-Content smoke-err.log -Raw)"
          if ($log -notmatch 'CastHandler: listening on port 8009' -or
              $log -notmatch 'AirShowHandler: listening on port 7400' -or
              $log -notmatch 'MdnsResponder: built-in mDNS responder on port 5353' -or
              $log -match 'dnssd_init failed' -or
              -not $mdnsOk) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: AirShow-windows-x64
          path: dist/AirShow-windows-x64.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-appimage, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AirShow-windows-x64.zip
            AirShow-macos-arm64.dmg
            AirShow-linux-x86_64.AppImage
          generate_release_notes: true
